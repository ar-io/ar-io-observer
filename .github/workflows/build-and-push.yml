name: build-and-push

on:
  push:
    branches:
      - develop
      - main
  # Run lint/test/build on PRs too. Until this was added, the `build` job only
  # ran AFTER a merge to develop/main, so a pull request had no test signal at
  # all — the sole required check was an external reviewer bot. The container
  # push below is deliberately excluded from PR runs (see its `if`).
  pull_request:
    branches:
      - develop
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        step: ['lint:check', 'test', 'build']
    steps:
      - uses: actions/checkout@v4
      - name: Setup yarn
        uses: actions/setup-node@v3
        with:
          node-version-file: .nvmrc
          cache: 'yarn'
      - run: yarn --immutable --immutable-cache
      - run: yarn ${{ matrix.step }}

  push:
    needs: [build]
    # Never publish a container from a pull request. PR runs exist for the
    # `build` signal only; `pull_request` from a fork would also lack the
    # credentials this job needs.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      checks: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image to GitHub Container Registry
        uses: docker/build-push-action@v4
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/ar-io/ar-io-observer:${{ github.sha }}
            ghcr.io/ar-io/ar-io-observer:latest
